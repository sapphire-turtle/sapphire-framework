name: Release-plz

# For an application with a CLI tagged `v{version}` and a desktop app tagged
# `desktop-v{version}`. Replace <app> with the package prefix.
on:
  push:
    branches:
      - main
  workflow_dispatch:

# Keep the release command and the release PR from racing on the same branch.
concurrency:
  group: release-plz-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-plz:
    permissions:
      contents: write
      pull-requests: write
    uses: sapphire-turtle/sapphire-framework/.github/workflows/shared-release-plz.yml@main
    secrets: inherit

  build-cli:
    needs: release-plz
    if: contains(fromJSON(needs.release-plz.outputs.packages), '<app>')
    permissions:
      contents: write
    uses: ./.github/workflows/release-binaries.yml
    with:
      tag: ${{ fromJSON(needs.release-plz.outputs.tags)['<app>'] }}
      target: cli

  build-desktop:
    needs: release-plz
    if: contains(fromJSON(needs.release-plz.outputs.packages), '<app>-desktop')
    permissions:
      contents: write
    uses: ./.github/workflows/release-binaries.yml
    with:
      tag: ${{ fromJSON(needs.release-plz.outputs.tags)['<app>-desktop'] }}
      target: desktop
