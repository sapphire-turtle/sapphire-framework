[package]
name = "sapphire-sync"
version = "0.1.0"
edition.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
categories = ["command-line-utilities"]
keywords = ["sync", "p2p", "file-sync", "local-first"]

[[bin]]
name = "sapphire-sync"
path = "src/main.rs"

[dependencies]
sapphire-sync-core.workspace = true
anyhow.workspace = true
clap.workspace = true
# The bridge client and `ManagedBy`: the facade does not re-export -bridge-api.
sapphire-bridge-api.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal"] }
tracing.workspace = true
tracing-subscriber = { workspace = true }

[dev-dependencies]
tempfile.workspace = true
# The serve smoke tests probe the endpoint directly (`Endpoint`, `probe`),
# reach `ManagedBy` (the same path `server.rs` uses) for the in-process
# server, and take `StubBridge` from the server crate's `test-util`.
sapphire-ipc.workspace = true
sapphire-bridge-api.workspace = true
sapphire-framework-server.workspace = true
