[package]
name = "sapphire-sync-desktop"
# Versioned on its own, not with the app's crates: the GUI can change without
# them, and they without it.
version = "0.13.0"
edition.workspace = true
description = "Desktop GUI for sapphire-sync"
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
sapphire-framework = { version = "0.18.0", default-features = false, features = ["gui"] }
eframe = "0.36"
tokio = { workspace = true, features = ["rt-multi-thread"] }
tracing.workspace = true
tracing-subscriber.workspace = true
