[package]
name = "sapphire-framework-keys"
version.workspace = true
edition.workspace = true
description = "Bearer-token authentication against the workspace's API keys, for sapphire-framework apps"
license.workspace = true
repository.workspace = true
keywords = ["auth", "api-keys", "bearer-token"]
categories = ["authentication"]

[features]
default = []
axum = ["dep:axum"]

[dependencies]
axum = { workspace = true, optional = true }
async-trait.workspace = true
corundum-framework-keys.workspace = true
tracing.workspace = true

[dev-dependencies]
tempfile = "3"
tower = { workspace = true, features = ["util"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
http-body-util = "0.1"

[dev-dependencies.axum]
workspace = true
features = ["http1", "json", "tokio"]
