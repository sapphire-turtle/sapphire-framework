# Spike (not for merging): does cargo-packager package, sign and update a desktop app the
# way the sapphire apps need? See README.md.
[package]
name = "packager-demo"
version = "0.1.0"
edition = "2024"
publish = false

# Not a member of the framework's workspace.
[workspace]

[dependencies]
cargo-packager-updater = "0.2.3"

[package.metadata.packager]
productName = "Packager Demo"
identifier = "org.sapphire-turtle.packager-demo"
beforePackagingCommand = "cargo build --release"
binaries = [{ path = "packager-demo", main = true }]
icons = ["icons/32x32.png", "icons/128x128.png", "icons/256x256.png", "icons/512x512.png"]
# Matches the Developer ID Application identity the CI imports (codesign takes a prefix).
macos = { signingIdentity = "Developer ID Application" }
