[package]
name = "sapphire-framework-bridge-embed"
version.workspace = true
edition.workspace = true
description = "Embedding component of the sapphire bridge: a local Qwen3-VL-Embedding model (texts and images) or an OpenAI-compatible endpoint"
license.workspace = true
repository.workspace = true
keywords = ["embedding", "bridge", "local-first", "qwen3"]
categories = ["science"]

[features]
default = ["local"]
# The local model (candle, on the CPU).
local = ["dep:candle-core", "dep:candle-nn", "dep:tokenizers", "dep:hf-hub", "dep:image"]

[dependencies]
candle-core = { version = "0.11.0", optional = true }
candle-nn = { version = "0.11.0", optional = true }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif"], optional = true }
tokenizers = { version = "0.23.2", default-features = false, features = ["onig"], optional = true }
# The model is fetched through hf-hub into an explicit cache directory.
hf-hub = { version = "0.5.0", default-features = false, features = ["ureq", "native-tls"], optional = true }
ureq = { version = "3.3", features = ["json"] }
sapphire-bridge-api = { package = "sapphire-framework-bridge-api", version = "2.4.0", path = "../sapphire-framework-bridge-api" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tokio = { workspace = true, features = ["sync", "rt"] }

[dev-dependencies]
corundum-framework-platform.workspace = true
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
