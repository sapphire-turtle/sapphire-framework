name: Release-plz

# The CLI and the server (`sapphire-sync`) are tagged `v{version}`, the desktop
# app `desktop-v{version}` (release-plz.toml). Each gets its binaries built once
# release-plz has made its release.
on:
  push:
    branches:
      - main
  workflow_dispatch:

# Keep the release command and the release PR from racing on the same branch.
concurrency:
  group: release-plz-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-plz:
    permissions:
      contents: write
      pull-requests: write
    uses: sapphire-turtle/.github/.github/workflows/release-plz.yml@v1
    secrets: inherit

  build-cli:
    needs: release-plz
    if: contains(fromJSON(needs.release-plz.outputs.packages), 'sapphire-sync')
    permissions:
      contents: write
    uses: ./.github/workflows/release-binaries.yml
    with:
      tag: ${{ fromJSON(needs.release-plz.outputs.tags)['sapphire-sync'] }}
      target: cli

  build-desktop:
    needs: release-plz
    if: contains(fromJSON(needs.release-plz.outputs.packages), 'sapphire-sync-desktop')
    permissions:
      contents: write
    uses: ./.github/workflows/release-binaries.yml
    with:
      tag: ${{ fromJSON(needs.release-plz.outputs.tags)['sapphire-sync-desktop'] }}
      target: desktop
