[workspace]
members = [
    "cli",
    "desktop",
    "crates/sapphire-sync-core",
    "crates/sapphire-sync-api",
    "crates/sapphire-sync-ui",
    # The phone app. A member so it shares the lock file, not a default member: the
    # desktop build needs no Android NDK.
    "mobile",
]
default-members = ["cli"]
resolver = "3"

[workspace.package]
# The CLI and the core move together; `sapphire-sync-desktop` and
# `sapphire-sync-api` are versioned on their own.
version = "0.14.0"
description = "A sync-only reference app for sapphire-framework - simple P2P file sync over iroh, CLI with embedded server"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sapphire-turtle/sapphire-sync"
edition = "2024"

[workspace.dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
grain-id = { version = "0.16", features = ["serde"] }
# The framework facade. A sync app needs the server/sync stack plus the bridge
# module (Task 4's e2e harness runs real bridges through it). `retrieve` comes
# in through `workspace` regardless, but only its full-text half: the
# embedding stack (`fastembed-embed`) stays off, and CI guards that. The
# `server` feature implies `backend` + `workspace`, which is where AppContext
# lives. `ipc` is the transport: the CLI's own one-shot
# verbs connect over it (`Endpoint`, Task 3's `sync disable`) and the tests
# probe it while a server starts. `redb-store` must be enabled explicitly: with
# default-features = false the persistent store silently falls back to
# in-memory otherwise.
sapphire-framework = { version = "0.21.0", default-features = false, features = ["server", "sync", "bridge", "ipc", "redb-store"] }
# Test-only: the bridge control-plane client (`BridgeClient`) the e2e harness
# connects to each host's bridge with. It lives in
# `sapphire-framework-bridge-client`, which the facade does not re-export (the
# facade's `bridge` module is the daemon side). The app itself leaves the
# connection to the framework's `SyncRuntime`.
sapphire-bridge-client = { package = "sapphire-framework-bridge-client", version = "0.21.0" }
# Test-only: the bridge's wire types (`GrainId`, its own `ManagedBy`) the e2e
# harness registers app servers with.
sapphire-bridge-api = { package = "sapphire-framework-bridge-api", version = "2.3.0" }
# Test-only: the server crate's `StubBridge` rides behind `test-util`, which the
# facade does not expose, so tests reach the crate directly.
sapphire-framework-server = { version = "0.21.0", default-features = false, features = ["test-util"] }
# Test-only: `probe` (is anything listening?) while a server starts, and the
# direct client handshake (`ClientInfo`, `connect_or_absent`) the sync tests
# use to ride the framework's `sync.enable` path the way `workspace init
# --sync` does.
sapphire-ipc = { package = "sapphire-framework-ipc", version = "0.21.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1" }
toml = "1.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# local crates
sapphire-sync-core = { path = "crates/sapphire-sync-core", version = "0.14.0" }
sapphire-sync-api = { path = "crates/sapphire-sync-api", version = "1.0.1" }

[profile.dev.package."*"]
opt-level = 1

# TEMPORARY (mobile branch): the framework's unreleased `mobile` feature and in-process
# IPC carrier, from its `feat/mobile-android` worktree. Replace with the release once
# sapphire-framework publishes it.
[patch.crates-io]
sapphire-framework = { path = "../sapphire-framework-wt-mobile/crates/sapphire-framework" }
sapphire-framework-backend = { path = "../sapphire-framework-wt-mobile/crates/sapphire-framework-backend" }
sapphire-framework-bridge = { path = "../sapphire-framework-wt-mobile/crates/sapphire-framework-bridge" }
sapphire-framework-bridge-api = { path = "../sapphire-framework-wt-mobile/crates/sapphire-framework-bridge-api" }
sapphire-framework-bridge-client = { path = "../sapphire-framework-wt-mobile/crates/sapphire-framework-bridge-client" }
sapphire-framework-gui = { path = "../sapphire-framework-wt-mobile/crates/sapphire-framework-gui" }
sapphire-framework-ipc = { path = "../sapphire-framework-wt-mobile/crates/sapphire-framework-ipc" }
sapphire-framework-registry = { path = "../sapphire-framework-wt-mobile/crates/sapphire-framework-registry" }
sapphire-framework-retrieve = { path = "../sapphire-framework-wt-mobile/crates/sapphire-framework-retrieve" }
sapphire-framework-server = { path = "../sapphire-framework-wt-mobile/crates/sapphire-framework-server" }
sapphire-framework-server-api = { path = "../sapphire-framework-wt-mobile/crates/sapphire-framework-server-api" }
sapphire-framework-service = { path = "../sapphire-framework-wt-mobile/crates/sapphire-framework-service" }
sapphire-framework-session = { path = "../sapphire-framework-wt-mobile/crates/sapphire-framework-session" }
sapphire-framework-sync = { path = "../sapphire-framework-wt-mobile/crates/sapphire-framework-sync" }
sapphire-framework-track = { path = "../sapphire-framework-wt-mobile/crates/sapphire-framework-track" }
sapphire-framework-update = { path = "../sapphire-framework-wt-mobile/crates/sapphire-framework-update" }
sapphire-framework-workspace = { path = "../sapphire-framework-wt-mobile/crates/sapphire-framework-workspace" }
