[package]
name = "sapphire-framework-bridge-client"
version.workspace = true
edition.workspace = true
description = "An app server's typed client for the sapphire-framework bridge"
license.workspace = true
repository.workspace = true
keywords = ["bridge", "ipc", "client", "local-first"]
categories = ["network-programming"]

[dependencies]
sapphire-bridge-api = { package = "sapphire-framework-bridge-api", version = "3.0.0", path = "../sapphire-framework-bridge-api" }
sapphire-ipc = { package = "sapphire-framework-ipc", version = "0.22.0", path = "../sapphire-framework-ipc" }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "io-util"] }
tracing.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "sync", "io-util"] }
