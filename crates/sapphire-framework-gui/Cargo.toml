[package]
name = "sapphire-framework-gui"
version.workspace = true
edition.workspace = true
description = "Shared egui components for sapphire-framework apps (workspace, workgroup and device management)"
license.workspace = true
repository.workspace = true
keywords = ["gui", "egui", "workspace", "local-first"]
categories = ["gui"]

# egui-only by default: these are widgets/screens rendered inside a host app's
# egui context. All consuming apps must use the same egui major version.
#
# `eframe` adds `app::run`, which starts a desktop window (corundum-framework-gui's window, with
# logging and the framework client) for apps that are an eframe app and nothing more.
# Without it, nothing here pulls eframe in, corundum-framework-gui's included.
[features]
eframe = ["dep:eframe", "corundum-framework-gui/eframe", "dep:sapphire-workspace", "tokio/rt-multi-thread"]
# `mobile::run_android` (and later iOS): the window, with the bridge and the app server
# hosted in this process over the in-process IPC carrier.
mobile = [
    "eframe",
    "corundum-framework-gui/android",
    "dep:sapphire-framework-server",
    "dep:sapphire-framework-bridge",
    "sapphire-framework-bridge/node",
]

[dependencies]
sapphire-backend = { package = "sapphire-framework-backend", version = "0.21.0", path = "../sapphire-framework-backend", default-features = false }
sapphire-bridge-api = { package = "sapphire-framework-bridge-api", version = "2.4.0", path = "../sapphire-framework-bridge-api" }
sapphire-bridge-client = { package = "sapphire-framework-bridge-client", version = "0.21.0", path = "../sapphire-framework-bridge-client" }
sapphire-ipc = { package = "sapphire-framework-ipc", version = "0.21.0", path = "../sapphire-framework-ipc" }
# The look shared with asteria: the frame, the fonts and the icons (#318).
# Lives in its own repository (sapphire-turtle/corundum-framework). A git dependency until
# its first release, which waits for its demo app: until then this crate cannot be published.
corundum-framework-gui = { version = "0.1.0", git = "https://github.com/sapphire-turtle/corundum-framework", default-features = false }
egui = "0.36"
eframe = { version = "0.37", optional = true }
sapphire-workspace = { package = "sapphire-framework-workspace", version = "0.21.0", path = "../sapphire-framework-workspace", default-features = false, optional = true }
sapphire-framework-server = { version = "0.21.0", path = "../sapphire-framework-server", default-features = false, features = ["redb-store"], optional = true }
sapphire-framework-bridge = { version = "0.21.0", path = "../sapphire-framework-bridge", optional = true }
grain-id.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time", "macros", "process"] }
tracing.workspace = true

# A folder dialog exists only on the desktops.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
rfd = "0.17"

[dev-dependencies]
sapphire-framework-bridge = { path = "../sapphire-framework-bridge", features = ["test-util"] }
sapphire-framework-server = { path = "../sapphire-framework-server", features = ["test-util"] }
sapphire-workspace = { package = "sapphire-framework-workspace", path = "../sapphire-framework-workspace", default-features = false }
tempfile = "3"
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
