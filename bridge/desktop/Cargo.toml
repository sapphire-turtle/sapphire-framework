[package]
name = "sapphire-bridge-desktop"
# Released with the framework, under its `v{version}` tags; its binary goes onto that
# release (release-bridge.yml), not to crates.io.
version.workspace = true
edition.workspace = true
description = "Sapphire Bridge's desktop app: its window, and the same commands as sapphire-bridge"
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "sapphire-bridge-desktop"
path = "src/main.rs"

# The Windows console shim the package puts on `PATH` as `sapphire-bridge.exe`
# (src/bin/console.rs).
[[bin]]
name = "sapphire-bridge-console"
path = "src/bin/console.rs"
required-features = ["package"]

[features]
# The release workflow's build: the package's start, its updater, its first run
# and its service (src/package.rs). `cargo build` makes the plain binary.
package = [
    "dep:corundum-framework-package",
    "dep:tracing",
    "sapphire-framework-gui/package",
]

[dependencies]
sapphire-bridge = { package = "sapphire-framework-bridge", version = "0.27.0", path = "../../crates/sapphire-framework-bridge", features = ["node"] }
sapphire-framework-bridge-embed = { version = "0.27.0", path = "../../crates/sapphire-framework-bridge-embed", features = ["factory"] }
sapphire-framework-gui = { version = "0.27.0", path = "../../crates/sapphire-framework-gui", features = ["eframe"] }
corundum-framework-package = { version = "0.9.1", features = ["service"], optional = true }
# The window's icon and app-menu entry (`LauncherSpec`); the package's layout.
corundum-framework-platform.workspace = true
tracing = { workspace = true, optional = true }
clap.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

[dev-dependencies]
corundum-framework-package = { version = "0.9.1", features = ["service", "test-support"] }
tempfile = "3"

# The package (sapphire-turtle/.github's release-packager.yml, corundum-framework#103): the
# window's binary, built with the `package` feature; the release workflow adds the Windows
# console shim as `sapphire-bridge.exe`. The product name is the launcher's (`LauncherSpec::name`), so
# the installer's shortcut and the launcher's entry coincide. The icons are rendered into
# `icons/` by the `icons` example before packaging.
[package.metadata.packager]
productName = "Sapphire Bridge"
identifier = "org.sapphire-turtle.sapphire-bridge"
category = "Utility"
binaries = [{ path = "sapphire-bridge-desktop", main = true }]
icons = ["icons/icon.png", "icons/icon.icns", "icons/icon.ico"]
