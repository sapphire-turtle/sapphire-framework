[package]
name = "sapphire-sync-desktop"
# Released together with `sapphire-sync-headless`, under its `v{version}` tags
# (release-plz.toml).
version.workspace = true
edition.workspace = true
description = "Desktop GUI for sapphire-sync"
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "sapphire-sync-desktop"
path = "src/main.rs"

# The Windows console shim the package puts on `PATH` as `sapphire-sync.exe`
# (src/bin/console.rs).
[[bin]]
name = "sapphire-sync-console"
path = "src/bin/console.rs"
required-features = ["package"]

[features]
# The release workflow's build: the package's start, its updater, its first run
# and its service (src/package.rs). `cargo build` makes the plain binary.
package = ["sapphire-framework/package", "dep:tokio"]

[dependencies]
# Every command but the window — `serve`, `status`, `sync`, `workspace`, … —
# runs the CLI's own code, so this one binary does all the CLI does.
sapphire-sync-cli = { version = "0.26.1", path = "../crates/sapphire-sync-cli" }
clap.workspace = true
# `eframe`: `gui::app::run` starts the window, and `gui::{eframe, egui}` are the
# versions it renders with.
sapphire-framework = { version = "0.26.1", path = "../../crates/sapphire-framework", default-features = false, features = ["eframe", "server"] }
# The window's icon and app-menu entry (`LauncherSpec`'s icon), and whether this runs in a
# package; the framework's version of it.
corundum-framework-platform = "0.9.0"
# `update` in the package runs `sapphire-bridge update` first.
tokio = { workspace = true, features = ["rt"], optional = true }

# The package (sapphire-turtle/.github's release-packager.yml, corundum-framework#103): the
# window's binary, built with the `package` feature; the release workflow adds the Windows
# console shim as `sapphire-sync.exe`. The product name is the launcher's (`LauncherSpec::name`), so
# the installer's shortcut and the launcher's entry coincide. The icons are rendered into
# `icons/` by the `icons` example before packaging.
[package.metadata.packager]
productName = "Sapphire Sync"
identifier = "org.sapphire-turtle.sapphire-sync"
category = "Utility"
binaries = [{ path = "sapphire-sync-desktop", main = true }]
icons = ["icons/icon.png", "icons/icon.icns", "icons/icon.ico"]

# `cargo binstall --git https://github.com/sapphire-turtle/sapphire-framework sapphire-sync-desktop`
# downloads the release file instead of building it (this crate is not on crates.io), following
# sapphire-turtle/.github's README.md#conventions: the files are bare binaries named
# `<crate>-<os>-<arch>`, beside the headless edition's under the shared `v{version}` tag, so
# each release platform names its own. quick-install is a third party's build: only this
# repository's files, or a build from source, are installed.
[package.metadata.binstall]
pkg-fmt = "bin"
disabled-strategies = ["quick-install"]

[package.metadata.binstall.overrides.x86_64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-linux-x86_64"

[package.metadata.binstall.overrides.aarch64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-linux-aarch64"

[package.metadata.binstall.overrides.aarch64-apple-darwin]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-macos-aarch64"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-windows-x86_64.exe"
