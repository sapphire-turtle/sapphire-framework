name: Install scripts

# install/install.sh and install.ps1 download real releases, so they can break
# without a change here (a renamed release file, a new tag prefix): besides
# pull requests that touch them, run them weekly against the live releases.
on:
  pull_request:
    paths:
      - "install/**"
      - ".github/workflows/install.yml"
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: shellcheck install/install.sh

  install-sh:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install sync and, with it, the bridge
        env:
          # The runners share the unauthenticated API rate limit.
          GITHUB_TOKEN: ${{ github.token }}
        run: sh install/install.sh --dir "$RUNNER_TEMP/bin" sync
      - name: The installed binaries run
        run: |
          "$RUNNER_TEMP/bin/sapphire-bridge" --version
          "$RUNNER_TEMP/bin/sapphire-sync" --version

  install-ps1:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install sync and, with it, the bridge
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./install/install.ps1 -Dir "$env:RUNNER_TEMP\bin" sync
      - name: The installed binaries run
        shell: pwsh
        run: |
          & "$env:RUNNER_TEMP\bin\sapphire-bridge.exe" --version
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & "$env:RUNNER_TEMP\bin\sapphire-sync.exe" --version
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
