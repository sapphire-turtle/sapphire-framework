name: Install scripts

# install/install.sh and install.ps1 download real releases, so they can break
# without a change here (a renamed release file, a new tag prefix): besides
# pull requests that touch them, run them weekly against the live releases.
on:
  pull_request:
    paths:
      - "install/**"
      - ".github/workflows/install.yml"
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: shellcheck install/install.sh

  install-sh:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install the CLIs and, with them, the bridge
        env:
          # The runners share the unauthenticated API rate limit.
          GITHUB_TOKEN: ${{ github.token }}
        run: sh install/install.sh --dir "$RUNNER_TEMP/bin" sync journal agent ledger tally
      - name: The installed binaries run
        run: |
          for bin in sapphire-bridge sapphire-sync sapphire-journal sapphire-ledger sapphire-tally; do
            "$RUNNER_TEMP/bin/$bin" --version
          done
          # sapphire-agent has no --version.
          "$RUNNER_TEMP/bin/sapphire-agent" --help > /dev/null
      - name: A retired name points to its replacement
        run: |
          if sh install/install.sh --dir "$RUNNER_TEMP/bin" agent-cli 2>err; then exit 1; fi
          grep -q 'install agent instead' err

  install-ps1:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install the CLIs and, with them, the bridge
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./install/install.ps1 -Dir "$env:RUNNER_TEMP\bin" sync journal agent ledger tally
      - name: The installed binaries run
        shell: pwsh
        run: |
          foreach ($bin in 'sapphire-bridge', 'sapphire-sync', 'sapphire-journal', 'sapphire-ledger', 'sapphire-tally') {
            & "$env:RUNNER_TEMP\bin\$bin.exe" --version
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
          # sapphire-agent has no --version.
          & "$env:RUNNER_TEMP\bin\sapphire-agent.exe" --help | Out-Null
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
