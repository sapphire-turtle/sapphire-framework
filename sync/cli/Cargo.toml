[package]
name = "sapphire-sync"
version.workspace = true
edition.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
categories = ["command-line-utilities"]
keywords = ["sync", "p2p", "file-sync", "local-first"]

[[bin]]
name = "sapphire-sync"
path = "src/main.rs"

[dependencies]
sapphire-sync-core.workspace = true
# The app's own API version, which the server reports and `sync disable` names.
sapphire-sync-api.workspace = true
anyhow.workspace = true
serde_json.workspace = true
clap.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal"] }

[dev-dependencies]
tempfile.workspace = true
# The e2e harness's bridge client, connected to each host's own bridge: the
# facade does not re-export -bridge-client.
sapphire-bridge-client.workspace = true
# The e2e harness's bridge registrations (`GrainId`, the bridge's `ManagedBy`).
sapphire-bridge-api.workspace = true
# The e2e harness's `init_tracing` installs a warn-level subscriber so scenario
# runs emit framework logs on failure only. The app's own logging is the
# framework's business (`workspace::logging`), not this crate's.
tracing-subscriber = { workspace = true }
# The sync/serve tests take the server crate's `StubBridge` (the in-process
# bridge stand-in over a `Connection::pair`) from its `test-util` feature, and
# `probe` the endpoint while a server starts. `Endpoint` itself comes through
# the facade's `ipc` module, like the CLI's own code.
sapphire-framework-server.workspace = true
sapphire-ipc.workspace = true
# The e2e harness builds real bridges: `LoopbackNetwork`, `NetConfig` and the
# endpoint-taking constructors ride behind the bridge crate's `test-util`
# feature (the facade does not expose it).
sapphire-framework-bridge = { version = "0.21.0", features = ["test-util"] }
# The harness parses and rewrites one device-record field (`introduce`'s
# `~`-prefixed ledger copies).
toml.workspace = true

# `cargo binstall sapphire-sync` downloads the release file instead of building it, following
# sapphire-framework's ci/README.md#conventions: the files are bare binaries named
# `<binary>-<os>-<arch>`, so each release platform names its own. quick-install is a third
# party's build: only this repository's files, or a build from source, are installed.
[package.metadata.binstall]
pkg-fmt = "bin"
disabled-strategies = ["quick-install"]

[package.metadata.binstall.overrides.x86_64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-linux-x86_64"

[package.metadata.binstall.overrides.aarch64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-linux-aarch64"

[package.metadata.binstall.overrides.aarch64-apple-darwin]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-macos-aarch64"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-windows-x86_64.exe"
