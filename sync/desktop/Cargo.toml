[package]
name = "sapphire-sync-desktop"
# Versioned on its own, not with the app's crates: the GUI can change without
# them, and they without it.
version = "0.14.0"
edition.workspace = true
description = "Desktop GUI for sapphire-sync"
license-file = "LICENSE"
repository.workspace = true
publish = false

[dependencies]
# `eframe`: `gui::app::run` starts the window, and `gui::{eframe, egui}` are the
# versions it renders with.
sapphire-framework = { version = "0.21.0", default-features = false, features = ["eframe"] }
# The app's screens, shared with the phone app.
sapphire-sync-ui = { path = "../crates/sapphire-sync-ui" }
