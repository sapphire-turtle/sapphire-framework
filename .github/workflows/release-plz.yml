name: Release-plz

on:
  push:
    branches:
      - main

# Keep the release command and the release PR from racing on the same branch:
# while one release-plz run is in flight, the next one waits.
concurrency:
  group: release-plz-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-plz:
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/shared-release-plz.yml
    with:
      linux-packages: cmake libwayland-dev libxkbcommon-dev
    secrets: inherit

  # Only sapphire-framework-workspace makes the `v{version}` tag and GitHub
  # release (release-plz.toml); sapphire-bridge shares its version group, so its
  # binaries go onto that release.
  build-bridge:
    needs: release-plz
    if: contains(fromJSON(needs.release-plz.outputs.packages), 'sapphire-bridge')
    permissions:
      contents: write
    uses: ./.github/workflows/release-bridge.yml
    with:
      tag: ${{ fromJSON(needs.release-plz.outputs.tags)['sapphire-framework-workspace'] }}
