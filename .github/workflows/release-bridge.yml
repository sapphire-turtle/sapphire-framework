name: Release sapphire-bridge binaries

# Builds the sapphire-bridge binaries (the command line, and the desktop app with its
# window) and attaches them to an existing release.
# release-plz.yml calls it after a release; run it by hand to (re)upload them
# for an existing tag.
on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        required: true
        type: string
        description: 'Existing release tag to attach binaries to (e.g. v0.19.0).'

jobs:
  build:
    permissions:
      contents: write
    uses: sapphire-turtle/.github/.github/workflows/release-binary.yml@v1
    with:
      tag: ${{ inputs.tag }}
      package: sapphire-bridge-headless
      binary: sapphire-bridge
      # The files are named after the package, beside sapphire-bridge-desktop's, as the
      # apps' `<app>-headless`; the command keeps its name.
      asset: sapphire-bridge-headless
      linux-packages: libssl-dev pkg-config

  # The window (#363): the same commands, and a bare start opens Sapphire Bridge's window.
  # eframe's windowing needs the Wayland and xkb headers on Linux.
  build-desktop:
    permissions:
      contents: write
    uses: sapphire-turtle/.github/.github/workflows/release-binary.yml@v1
    with:
      tag: ${{ inputs.tag }}
      package: sapphire-bridge-desktop
      binary: sapphire-bridge-desktop
      linux-packages: libssl-dev pkg-config cmake libwayland-dev libxkbcommon-dev

  # Sapphire Bridge as a Velopack package (#363): an installer per desktop OS, and the files
  # the installed bridge updates itself from (bridge/desktop/src/package.rs reads this
  # repository's latest release). The package holds the desktop binary only; the bare
  # binaries above stay for servers, the install script and `cargo binstall`.
  # The release carries sapphire-sync's package too (release-sync.yml), so the bridge's has
  # channels of its own, `bridge-linux`, `-osx`, `-win`; the installers keep their names
  # (`sapphire-bridge-desktop-win-Setup.exe`, `sapphire-bridge-desktop.AppImage`).
  package:
    permissions:
      contents: write
    uses: sapphire-turtle/.github/.github/workflows/release-velopack.yml@v1
    # The macOS signing secrets.
    secrets: inherit
    with:
      tag: ${{ inputs.tag }}
      package: sapphire-bridge-desktop
      features: velopack
      console-bin: sapphire-bridge-console
      # One binary: the resident sync is its `serve` subcommand.
      command: sapphire-bridge
      # On Windows the package is installed in %LocalAppData%\<package id>, which its
      # uninstall deletes: never the data directory's name (`sapphire-bridge`, which holds
      # the device's identity), so the package's (corundum-framework#57).
      pack-id: sapphire-bridge-desktop
      title: Sapphire Bridge
      channel-prefix: bridge
      icons-example: icons
      linux-categories: Network
      macos-bundle-id: org.sapphire-turtle.sapphire-bridge
      linux-packages: libssl-dev pkg-config cmake
