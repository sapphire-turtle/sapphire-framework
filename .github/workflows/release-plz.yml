name: Release-plz

on:
  push:
    branches:
      - main

# Keep the release command and the release PR from racing on the same branch:
# while one release-plz run is in flight, the next one waits.
concurrency:
  group: release-plz-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-plz:
    permissions:
      contents: write
      pull-requests: write
    uses: sapphire-turtle/.github/.github/workflows/release-plz.yml@v1
    with:
      linux-packages: cmake libwayland-dev libxkbcommon-dev
    secrets: inherit

  # Only sapphire-framework-workspace makes the `v{version}` tag and GitHub
  # release (release-plz.toml); sapphire-bridge-headless shares its version group, so its
  # binaries go onto that release.
  build-bridge:
    needs: release-plz
    if: contains(fromJSON(needs.release-plz.outputs.packages), 'sapphire-bridge-headless')
    permissions:
      contents: write
    uses: ./.github/workflows/release-bridge.yml
    # The macOS signing secrets, for the package (release-bridge.yml, job `pack`).
    secrets: inherit
    with:
      tag: ${{ fromJSON(needs.release-plz.outputs.tags)['sapphire-framework-workspace'] }}

  # sapphire-sync (sync/): both editions and the desktop app's package, on the same release.
  build-sync:
    needs: release-plz
    if: contains(fromJSON(needs.release-plz.outputs.packages), 'sapphire-sync-headless')
    permissions:
      contents: write
    uses: ./.github/workflows/release-sync.yml
    # The macOS signing secrets, for the package (release-sync.yml, job `pack`).
    secrets: inherit
    with:
      tag: ${{ fromJSON(needs.release-plz.outputs.tags)['sapphire-framework-workspace'] }}
