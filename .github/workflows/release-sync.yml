name: Release sapphire-sync binaries

# Builds sapphire-sync's (sync/) headless edition's and desktop app's binaries for the
# four release platforms and attaches them to an existing `v{version}` release, which they
# share with the framework and the bridge. release-plz.yml calls it after a release; run it by hand to
# (re)upload the files for an existing tag.
on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to attach binaries to (e.g. v0.25.1).'
        required: true
        type: string

jobs:
  # Both binaries are `sapphire-sync` on PATH; the files are named by crate
  # to tell them apart.
  headless:
    permissions:
      contents: write
    uses: sapphire-turtle/.github/.github/workflows/release-binary.yml@v1
    with:
      tag: ${{ inputs.tag }}
      package: sapphire-sync-headless
      binary: sapphire-sync
      asset: sapphire-sync-headless

  desktop:
    permissions:
      contents: write
    uses: sapphire-turtle/.github/.github/workflows/release-binary.yml@v1
    with:
      tag: ${{ inputs.tag }}
      package: sapphire-sync-desktop
      binary: sapphire-sync-desktop
      linux-packages: libwayland-dev libxkbcommon-dev

  # Sapphire Sync as a package (#357, #403), with sapphire-turtle/.github's
  # release-packager.yml: an installer per desktop OS, each signed with the organization's
  # minisign key, and the feed `sapphire-sync-latest.json` the installed app updates itself
  # from (sync/desktop/src/package.rs reads this repository's latest release). The package
  # holds the desktop binary only, which runs the CLI too; the bare binaries above stay for
  # servers, the install script and `cargo binstall`. The release carries the bridge's
  # package too: each app has its own feed.
  package:
    permissions:
      contents: write
    uses: sapphire-turtle/.github/.github/workflows/release-packager.yml@v1
    # The signing key, and the macOS signing secrets.
    secrets: inherit
    with:
      tag: ${{ inputs.tag }}
      package: sapphire-sync-desktop
      app-name: sapphire-sync
      features: package
      console-bin: sapphire-sync-console
      # One binary: the app server is its `serve` subcommand.
      command: sapphire-sync
      # The icons [package.metadata.packager] names, rendered from the app's SVG.
      pre-package: cargo run --release --locked -p sapphire-sync-desktop --example icons -- "$CRATE_DIR/icons"
