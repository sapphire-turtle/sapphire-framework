[workspace]
resolver = "3"
members = [
    "bridge",
    "crates/sapphire-framework-track",
    "crates/sapphire-framework-sync",
    "crates/sapphire-framework-session",
    "crates/sapphire-framework-ipc",
    "crates/sapphire-framework-bridge-api",
    "crates/sapphire-framework-settings",
    "crates/sapphire-framework-bridge-client",
    "crates/sapphire-framework-bridge",
    "crates/sapphire-framework-bridge-embed",
    "crates/sapphire-framework-server-api",
    "crates/sapphire-framework-server",
    "crates/sapphire-framework-mcp",
    "crates/sapphire-framework-frontmatter",
    "crates/sapphire-framework-service",
    "crates/sapphire-framework-update",
    "crates/sapphire-framework-retrieve",
    "crates/sapphire-framework-workspace",
    "crates/sapphire-framework-keys",
    "crates/sapphire-framework-registry",
    "crates/sapphire-framework-backend",
    "crates/sapphire-framework-gui",
    "crates/sapphire-framework",
]

[workspace.package]
version = "0.23.0"
description = "Local-first, file-based workspace framework made for human-agent collaboration - indexing, search and sync over plain-text files"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sapphire-turtle/sapphire-framework"
edition = "2024"

[workspace.dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
indexmap = { version = "2", features = ["serde"] }
rmcp = { version = "3.5", default-features = false }
schemars = "1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1" }
toml = "1.1"
# Same major.minor as the `toml` crate's own dependency, so the lockfile keeps one copy.
toml_edit = "0.25"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = "0.3"
uuid = { version = "1", features = ["v4", "v7", "serde"] }
# The shared app framework (sapphire-turtle/corundum-framework): the platform's
# directories here, the GUI's look in sapphire-framework-gui.
corundum-framework-platform = "0.3.0"
corundum-framework-gui = { version = "0.3.0", default-features = false }
getrandom = "0.4"
async-trait = "0.1"
axum = "0.8"
metrics = "0.24"
# Rendering only: the route is mounted on the server's own axum listener, so no hyper
# server and no push gateway.
metrics-exporter-prometheus = { version = "0.18", default-features = false }
metrics-process = "2.4"
base64 = "0.23"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
sha2 = "0.11"
redb = "4"
walkdir = "2"
tower = "0.5"
grain-id = { version = "0.16", features = ["serde"] }

[profile.dev.package."*"]
opt-level = 1
