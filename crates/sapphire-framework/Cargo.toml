[package]
name = "sapphire-framework"
version.workspace = true
edition.workspace = true
description = "Local-first, file-based workspace framework made for human-agent collaboration - single-dependency facade over the sapphire-framework-* crates"
license.workspace = true
repository.workspace = true
keywords = ["local-first", "workspace", "search", "sync"]
categories = ["filesystem", "database"]

# Facade crate (bevy-style): depend on this one crate and enable features for the
# pieces you need. Each feature exposes an internal crate as a module
# (`sapphire_framework::workspace`, `::backend`, `::keys`, …). The internal
# `sapphire-framework-*` crates stay split for compile isolation.
[features]
default = ["workspace", "redb-store"]

# ── modules ──────────────────────────────────────────────────────────────────
workspace = ["dep:sapphire-framework-workspace"]
retrieve = ["dep:sapphire-framework-retrieve"]
track = ["dep:sapphire-framework-track"]
sync = ["dep:sapphire-framework-sync"]
session = ["dep:sapphire-framework-session"]
ipc = ["dep:sapphire-framework-ipc"]
server = ["dep:sapphire-framework-server", "backend"]
registry = ["dep:sapphire-framework-registry"]
bridge = ["dep:sapphire-framework-bridge"]
# The bridge's embedding component (local Qwen3-VL via candle, or REST). For apps that embed
# the bridge in-process (mobile). Heavy, so not in `native`.
bridge-embed = ["bridge", "dep:sapphire-framework-bridge-embed"]
backend = ["dep:sapphire-framework-backend", "workspace"]
gui = ["dep:sapphire-framework-gui", "backend"]
# `gui::app::run`: a desktop app's window on eframe + wgpu, started the same way for every app.
eframe = ["gui", "sapphire-framework-gui/eframe"]
keys = ["dep:sapphire-framework-keys", "sapphire-framework-keys/axum"]
service = ["dep:sapphire-framework-service"]
# The app server's HTTP listener (`AppServer::http`), every route behind an external device's token.
http = ["server", "sapphire-framework-server/http"]
# MCP: the shared tools, the `mcp` subcommand (stdio, through the server's IPC endpoint) and
# `/mcp` on the HTTP listener when the server's config turns it on. Not in `native`: an app
# opts in (sapphire-agent does not).
mcp = ["http", "sapphire-framework-server/mcp", "dep:sapphire-framework-mcp"]
# YAML front matter for Markdown files (split, parse, render, edit one key in place).
frontmatter = ["dep:sapphire-framework-frontmatter"]

# Everything usable on a native host.
native = ["workspace", "backend", "server", "bridge", "registry", "service"]

# ── store passthrough (apply to whichever crates are enabled) ───────────────
redb-store = [
    "sapphire-framework-workspace?/redb-store",
    "sapphire-framework-backend?/redb-store",
]

[dependencies]
sapphire-framework-workspace = { version = "0.20.0", path = "../sapphire-framework-workspace", optional = true, default-features = false }
sapphire-framework-retrieve = { version = "0.20.0", path = "../sapphire-framework-retrieve", optional = true, default-features = false }
sapphire-framework-track = { version = "0.20.0", path = "../sapphire-framework-track", optional = true }
sapphire-framework-sync = { version = "0.20.0", path = "../sapphire-framework-sync", optional = true }
sapphire-framework-session = { version = "0.20.0", path = "../sapphire-framework-session", optional = true }
sapphire-framework-ipc = { version = "0.20.0", path = "../sapphire-framework-ipc", optional = true }
sapphire-framework-server = { version = "0.20.0", path = "../sapphire-framework-server", optional = true }
sapphire-framework-registry = { version = "0.20.0", path = "../sapphire-framework-registry", optional = true }
sapphire-framework-bridge = { version = "0.20.0", path = "../sapphire-framework-bridge", optional = true }
sapphire-framework-bridge-embed = { version = "0.20.0", path = "../sapphire-framework-bridge-embed", optional = true }
sapphire-framework-backend = { version = "0.20.0", path = "../sapphire-framework-backend", optional = true, default-features = false }
sapphire-framework-gui = { version = "0.20.0", path = "../sapphire-framework-gui", optional = true }
sapphire-framework-keys = { version = "0.20.0", path = "../sapphire-framework-keys", optional = true }
sapphire-framework-service = { version = "0.20.0", path = "../sapphire-framework-service", optional = true }
sapphire-framework-mcp = { version = "0.20.0", path = "../sapphire-framework-mcp", optional = true }
sapphire-framework-frontmatter = { version = "0.20.0", path = "../sapphire-framework-frontmatter", optional = true }
