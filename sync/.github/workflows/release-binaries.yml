name: Release binaries

# Builds the headless edition's and the desktop app's binaries for the four release
# platforms and attaches them to an existing `v{version}` release, which the
# two share. release-plz.yml calls it after a release; run it by hand to
# (re)upload the files for an existing tag.
on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to attach binaries to (e.g. v0.15.0).'
        required: true
        type: string

jobs:
  # Both binaries are `sapphire-sync` on PATH; the files are named by crate
  # to tell them apart.
  headless:
    permissions:
      contents: write
    uses: sapphire-turtle/.github/.github/workflows/release-binary.yml@v1
    with:
      tag: ${{ inputs.tag }}
      package: sapphire-sync-headless
      binary: sapphire-sync
      asset: sapphire-sync-headless

  desktop:
    permissions:
      contents: write
    uses: sapphire-turtle/.github/.github/workflows/release-binary.yml@v1
    with:
      tag: ${{ inputs.tag }}
      package: sapphire-sync-desktop
      binary: sapphire-sync-desktop
      linux-packages: libwayland-dev libxkbcommon-dev
