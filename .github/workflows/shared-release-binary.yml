name: Shared release binary

# Builds one binary for the four release platforms and attaches it to an
# existing GitHub release as `<asset>-<os>-<arch>[.exe]`:
#
#   linux-x86_64, linux-aarch64, macos-aarch64, windows-x86_64.exe
#
# Those names are what `sapphire-framework-update` (the `update` command) and
# install/install.sh look for, so do not change them in one place only.
#
# Called from a repository's release-plz workflow once the release exists (see
# ci/templates/release-plz.yml). A tag pushed by a workflow does not start other
# workflows, which is why this is called rather than started by `on: push: tags`.
on:
  workflow_call:
    inputs:
      tag:
        description: 'Existing release tag to attach the binaries to (e.g. v0.19.0).'
        type: string
        required: true
      package:
        description: 'The cargo package to build.'
        type: string
        required: true
      binary:
        description: 'The binary target name, without `.exe`.'
        type: string
        required: true
      asset:
        description: 'The release file name before `-<os>-<arch>`. Defaults to the binary name.'
        type: string
        default: ''
      linux-packages:
        description: 'Extra apt packages to install on Linux, space separated. protoc is always installed.'
        type: string
        default: ''
      pre-build:
        description: 'A bash script run after the cargo cache is restored, before the build.'
        type: string
        default: ''
      windows:
        description: 'Build windows-x86_64 too. Turn it off for a binary that does not build there.'
        type: boolean
        default: true
      post-build:
        description: 'A bash script run after the build, with the built file in $BIN; fail it to keep a broken binary off the release.'
        type: string
        default: ''

defaults:
  run:
    shell: bash

jobs:
  build:
    # macOS and Windows are the platforms most likely to break unnoticed; a
    # failure there must not keep the Linux binaries from being uploaded.
    continue-on-error: ${{ matrix.os == 'macos-latest' || matrix.os == 'windows-latest' }}
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-24.04-arm has no `-latest` alias; macos-latest is Apple Silicon.
        os: ${{ fromJSON(inputs.windows
          && '["ubuntu-latest", "ubuntu-24.04-arm", "macos-latest", "windows-latest"]'
          || '["ubuntu-latest", "ubuntu-24.04-arm", "macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      # rustup installs the rust-toolchain.toml toolchain on first use.
      - name: Install the pinned toolchain
        run: cargo --version

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        env:
          PACKAGES: ${{ inputs.linux-packages }}
        run: |
          sudo apt-get update
          # Unquoted on purpose: PACKAGES is a list.
          sudo apt-get install -y protobuf-compiler $PACKAGES
      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install protobuf
      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: choco install protoc -y

      - uses: Swatinem/rust-cache@v2

      - name: Pre-build
        if: inputs.pre-build != ''
        env:
          SCRIPT: ${{ inputs.pre-build }}
        run: eval "$SCRIPT"

      # The release file names this runner the way sapphire-framework-update
      # does: <os>-<arch>, `.exe` on Windows.
      - name: Name the platform
        id: platform
        run: |
          case "$RUNNER_OS-$RUNNER_ARCH" in
            Linux-X64) platform=linux-x86_64 ;;
            Linux-ARM64) platform=linux-aarch64 ;;
            macOS-ARM64) platform=macos-aarch64 ;;
            Windows-X64) platform=windows-x86_64 ;;
            *) echo "::error::no release platform for $RUNNER_OS-$RUNNER_ARCH"; exit 1 ;;
          esac
          exe=""
          [ "$RUNNER_OS" = Windows ] && exe=".exe"
          {
            echo "name=$platform"
            echo "exe=$exe"
          } >> "$GITHUB_OUTPUT"

      - name: Build
        run: cargo build --release --locked --package "${{ inputs.package }}" --bin "${{ inputs.binary }}"

      - name: Post-build
        if: inputs.post-build != ''
        env:
          SCRIPT: ${{ inputs.post-build }}
          BIN: target/release/${{ inputs.binary }}${{ steps.platform.outputs.exe }}
        run: eval "$SCRIPT"

      - name: Name the release file
        id: asset
        env:
          BIN: target/release/${{ inputs.binary }}${{ steps.platform.outputs.exe }}
          BASE: ${{ inputs.asset != '' && inputs.asset || inputs.binary }}
        run: |
          name="$BASE-${{ steps.platform.outputs.name }}${{ steps.platform.outputs.exe }}"
          cp "$BIN" "$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Upload to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag }}
          files: ${{ steps.asset.outputs.name }}
