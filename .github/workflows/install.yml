name: Install scripts

# install/install.sh and install.ps1 download real releases, so they can break
# without a change here (a renamed release file, a new tag prefix): besides
# pull requests that touch them, run them weekly against the live releases.
on:
  pull_request:
    paths:
      - "install/**"
      - ".github/workflows/install.yml"
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: shellcheck install/install.sh

  install-sh:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install the CLIs and, with them, the bridge
        env:
          # The runners share the unauthenticated API rate limit.
          GITHUB_TOKEN: ${{ github.token }}
        run: sh install/install.sh --dir "$RUNNER_TEMP/bin" sync journal agent ledger tally
      - name: The installed binaries run
        run: |
          for bin in sapphire-bridge sapphire-sync sapphire-journal sapphire-ledger sapphire-tally; do
            "$RUNNER_TEMP/bin/$bin" --version
          done
          # sapphire-agent has no --version.
          "$RUNNER_TEMP/bin/sapphire-agent" --help > /dev/null
      - name: A retired name points to its replacement
        run: |
          if sh install/install.sh --dir "$RUNNER_TEMP/bin" agent-cli 2>err; then exit 1; fi
          grep -q 'install agent instead' err
      - name: A desktop app points to its installer
        run: |
          if sh install/install.sh --dir "$RUNNER_TEMP/bin" journal-desktop 2>err; then exit 1; fi
          grep -q 'sapphire-journal/releases/latest' err
      - name: An app whose desktop package is installed is skipped
        run: |
          # As the Velopack package lays itself out on each OS.
          if [ "$RUNNER_OS" = macOS ]; then
            mkdir -p "$HOME/Applications/Sapphire Sync.app"
          else
            mkdir -p "$HOME/.local/bin" "$RUNNER_TEMP/apps"
            touch "$RUNNER_TEMP/apps/Sapphire_Sync.AppImage"
            ln -sf "$RUNNER_TEMP/apps/Sapphire_Sync.AppImage" "$HOME/.local/bin/sapphire-sync"
          fi
          sh install/install.sh --no-bridge --dir "$RUNNER_TEMP/skip" sync > out
          grep -q 'Skipping sapphire-sync' out
          test ! -e "$RUNNER_TEMP/skip/sapphire-sync"

  install-ps1:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install the CLIs and, with them, the bridge
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./install/install.ps1 -Dir "$env:RUNNER_TEMP\bin" sync journal agent ledger tally
      - name: The installed binaries run
        shell: pwsh
        run: |
          foreach ($bin in 'sapphire-bridge', 'sapphire-sync', 'sapphire-journal', 'sapphire-ledger', 'sapphire-tally') {
            & "$env:RUNNER_TEMP\bin\$bin.exe" --version
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
          # sapphire-agent has no --version.
          & "$env:RUNNER_TEMP\bin\sapphire-agent.exe" --help | Out-Null
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: A desktop app points to its installer
        shell: pwsh
        run: |
          try { ./install/install.ps1 -Dir "$env:RUNNER_TEMP\bin" journal-desktop; exit 1 }
          catch { if ("$_" -notmatch 'sapphire-journal/releases/latest') { throw } }
      - name: An app whose desktop package is installed is skipped
        shell: pwsh
        run: |
          # As the Velopack package lays itself out.
          New-Item -ItemType Directory -Force "$env:LOCALAPPDATA\sapphire-sync" | Out-Null
          New-Item -ItemType File -Force "$env:LOCALAPPDATA\sapphire-sync\Update.exe" | Out-Null
          $out = ./install/install.ps1 -NoBridge -Dir "$env:RUNNER_TEMP\skip" sync 6>&1 | Out-String
          if ($out -notmatch 'Skipping sapphire-sync') { throw "not skipped: $out" }
          if (Test-Path "$env:RUNNER_TEMP\skip\sapphire-sync.exe") { throw 'installed anyway' }
