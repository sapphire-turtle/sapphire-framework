name: Mobile CI

# corundum-gui is shared with asteria, which ships on phones from the start (#318), so it
# is built for iOS and Android on every pull request that touches it. The rest of the
# workspace is not: `-p corundum-gui` builds the crate (egui, and eframe for its window)
# without it.
#
# Clippy for the phones, then the crate's tests on an iOS simulator and an Android emulator:
# the system font lookup differs on each (#321), and only there can it be seen to work.
#
# Not a required check: with the path filter it does not run on most pull requests, and a
# required check that never runs would leave them pending.
on:
  pull_request:
    # Cargo.lock too: a dependency bump (egui, resvg, fontdb) can break a mobile build.
    paths:
      - crates/corundum-gui/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - .github/workflows/mobile-ci.yml
      - .github/scripts/android-test-runner.sh

defaults:
  run:
    shell: bash

jobs:
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      # rustup installs the rust-toolchain.toml toolchain on first use; do that in its own
      # step so the download does not land in the middle of another.
      - name: Install the pinned toolchain
        run: cargo --version

      - name: Add the iOS targets
        run: rustup target add aarch64-apple-ios aarch64-apple-ios-sim

      - uses: Swatinem/rust-cache@v2

      - name: Clippy (device and simulator)
        run: |
          for t in aarch64-apple-ios aarch64-apple-ios-sim; do
            cargo clippy -p corundum-gui --target "$t" --all-targets --locked -- -D warnings || exit 1
          done

      # The simulator's CoreText lists the simulator's own fonts, not the Mac's, so this runs
      # the lookup a phone does (without the phone's sandbox).
      - name: Test on the simulator
        run: |
          udid=$(xcrun simctl list devices available --json \
            | jq -r '[.devices[][] | select(.name | startswith("iPhone"))][0].udid')
          xcrun simctl bootstatus "$udid" -b
          export CARGO_TARGET_AARCH64_APPLE_IOS_SIM_RUNNER="xcrun simctl spawn $udid"
          cargo test -p corundum-gui --lib --target aarch64-apple-ios-sim --locked

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install the pinned toolchain
        run: cargo --version

      - name: Add the Android targets
        run: rustup target add aarch64-linux-android x86_64-linux-android

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      # The runner has an NDK preinstalled; ANDROID_NDK_LATEST_HOME points at it. On Android
      # eframe's winit needs an activity chosen, so the default features do not build:
      # without eframe (the components alone), and with eframe on GameActivity, as the
      # sapphire apps' phones use it.
      - name: Clippy (arm64 phones and x86_64 emulators)
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          cargo ndk -t arm64-v8a -t x86_64 clippy -p corundum-gui --all-targets --locked --no-default-features -- -D warnings
          cargo ndk -t arm64-v8a -t x86_64 clippy -p corundum-gui --all-targets --locked --features eframe/android-game-activity -- -D warnings

      # Built before the emulator starts, so the emulator step only runs it.
      - name: Build the tests
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          cargo ndk -t x86_64 test -p corundum-gui --lib --no-run --locked --features eframe/android-game-activity

      # The emulator needs hardware acceleration, which the runner allows once /dev/kvm is
      # opened up to its user.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Test on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          CARGO_TARGET_X86_64_LINUX_ANDROID_RUNNER: ${{ github.workspace }}/.github/scripts/android-test-runner.sh
        with:
          api-level: 36
          arch: x86_64
          target: default
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect
          disable-animations: true
          script: ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME cargo ndk -t x86_64 test -p corundum-gui --lib --locked --features eframe/android-game-activity
