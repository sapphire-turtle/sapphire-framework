name: Release sapphire-bridge binaries

# Builds the sapphire-bridge binaries (the command line, and the desktop app with its
# window) and attaches them to an existing release.
# release-plz.yml calls it after a release; run it by hand to (re)upload them
# for an existing tag.
on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        required: true
        type: string
        description: 'Existing release tag to attach binaries to (e.g. v0.19.0).'

jobs:
  build:
    permissions:
      contents: write
    uses: sapphire-turtle/.github/.github/workflows/release-binary.yml@v1
    # The signing key: each file with its `<file>.sig`, which `update` checks (#402).
    secrets: inherit
    with:
      sign: true
      tag: ${{ inputs.tag }}
      package: sapphire-bridge-headless
      binary: sapphire-bridge
      # The files are named after the package, beside sapphire-bridge-desktop's, as the
      # apps' `<app>-headless`; the command keeps its name.
      asset: sapphire-bridge-headless
      linux-packages: libssl-dev pkg-config

  # The window (#363): the same commands, and a bare start opens Sapphire Bridge's window.
  # eframe's windowing needs the Wayland and xkb headers on Linux.
  build-desktop:
    permissions:
      contents: write
    uses: sapphire-turtle/.github/.github/workflows/release-binary.yml@v1
    # The signing key: each file with its `<file>.sig`, which `update` checks (#402).
    secrets: inherit
    with:
      sign: true
      tag: ${{ inputs.tag }}
      package: sapphire-bridge-desktop
      binary: sapphire-bridge-desktop
      linux-packages: libssl-dev pkg-config cmake libwayland-dev libxkbcommon-dev

  # Sapphire Bridge as a package (#363, #403), with sapphire-turtle/.github's
  # release-packager.yml: an installer per desktop OS, each signed with the organization's
  # minisign key, and the feed `sapphire-bridge-latest.json` the installed bridge updates
  # itself from (bridge/desktop/src/package.rs reads this repository's latest release). The
  # package holds the desktop binary only; the bare binaries above stay for servers, the
  # install script and `cargo binstall`. The release carries sapphire-sync's package too:
  # each app has its own feed.
  package:
    permissions:
      contents: write
    uses: sapphire-turtle/.github/.github/workflows/release-packager.yml@v1
    # The signing key, and the macOS signing secrets.
    secrets: inherit
    with:
      tag: ${{ inputs.tag }}
      package: sapphire-bridge-desktop
      app-name: sapphire-bridge
      features: package
      console-bin: sapphire-bridge-console
      # One binary: the resident sync is its `serve` subcommand.
      command: sapphire-bridge
      linux-packages: libssl-dev pkg-config cmake
      # The icons [package.metadata.packager] names, rendered from the app's SVG.
      pre-package: cargo run --release --locked -p sapphire-bridge-desktop --example icons -- "$CRATE_DIR/icons"
