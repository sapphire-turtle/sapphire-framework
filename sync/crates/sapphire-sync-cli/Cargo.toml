[package]
name = "sapphire-sync-cli"
# Released together with the two editions that run it, `sapphire-sync-headless`
# and `sapphire-sync-desktop` (release-plz.toml).
version.workspace = true
edition.workspace = true
description = "The command line of sapphire-sync's two editions, the headless one and the desktop app: its commands, the framework's and its own, which run the app server or call it"
license.workspace = true
repository.workspace = true
categories = ["command-line-utilities"]
keywords = ["sync", "p2p", "file-sync", "local-first"]

[dependencies]
sapphire-sync-core = { version = "0.27.0", path = "../sapphire-sync-core" }
# The app's own API version, which `sync disable` names.
sapphire-sync-api = { version = "1.0.2", path = "../sapphire-sync-api" }
sapphire-sync-server = { version = "0.27.0", path = "../sapphire-sync-server" }
anyhow.workspace = true
serde_json.workspace = true
clap.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal"] }

[dev-dependencies]
tempfile.workspace = true
# The sync tests take the server crate's `StubBridge` (the in-process bridge
# stand-in over a `Connection::pair`) from its `test-util` feature, and `probe`
# the endpoint while a server starts. `Endpoint` itself comes through the
# facade's `ipc` module, like the CLI's own code.
# Test-only: the server crate's `StubBridge` rides behind `test-util`, which the
# facade does not expose, so tests reach the crate directly.
sapphire-framework-server = { version = "0.27.0", path = "../../../crates/sapphire-framework-server", default-features = false, features = ["test-util"] }
# Test-only: `probe` (is anything listening?) while a server starts, and the direct
# client handshake (`ClientInfo`, `connect_or_absent`) the sync tests use to ride the
# framework's `sync.enable` path the way `workspace init --sync` does.
sapphire-ipc = { package = "sapphire-framework-ipc", version = "0.27.0", path = "../../../crates/sapphire-framework-ipc" }
