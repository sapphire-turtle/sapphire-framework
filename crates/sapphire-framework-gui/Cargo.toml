[package]
name = "sapphire-framework-gui"
version.workspace = true
edition.workspace = true
description = "Shared egui components for sapphire-framework apps (workspace, workgroup and device management)"
license.workspace = true
repository.workspace = true
keywords = ["gui", "egui", "workspace", "local-first"]
categories = ["gui"]

# egui-only by default: these are widgets/screens rendered inside a host app's
# egui context. All consuming apps must use the same egui major version.
#
# `eframe` adds `app::run`, which starts a desktop window (corundum-framework-gui's window, with
# logging and the framework client) for apps that are an eframe app and nothing more.
# Without it, nothing here pulls eframe in, corundum-framework-gui's included.
[features]
eframe = [
    "dep:eframe",
    "corundum-framework-gui/eframe",
    "corundum-framework-gui/single-instance",
    "tokio/rt-multi-thread",
]
# `mobile::run_android` (and later iOS): the window, with the bridge and the app server
# hosted in this process over the in-process IPC carrier.
# Sapphire Bridge's window in a cargo-packager package: its first run (welcome, keep running in the
# background) and About's service row and updates.
package = [
    "eframe",
    "corundum-framework-gui/package",
    "corundum-framework-gui/service",
    "corundum-framework-gui/update",
    "dep:corundum-framework-package",
    "dep:corundum-framework-update",
    "dep:sapphire-framework-update",
]
mobile = [
    "eframe",
    "corundum-framework-gui/android",
    "dep:sapphire-framework-server",
    "dep:sapphire-framework-bridge",
    "sapphire-framework-bridge/node",
]

[dependencies]
sapphire-backend = { package = "sapphire-framework-backend", version = "0.28.0", path = "../sapphire-framework-backend", default-features = false }
sapphire-bridge-api = { package = "sapphire-framework-bridge-api", version = "4.0.0", path = "../sapphire-framework-bridge-api" }
sapphire-bridge-client = { package = "sapphire-framework-bridge-client", version = "0.28.0", path = "../sapphire-framework-bridge-client" }
sapphire-ipc = { package = "sapphire-framework-ipc", version = "0.28.0", path = "../sapphire-framework-ipc" }
# `service_exe`: the executable a single-binary desktop app registers as its own server.
# The look shared with asteria: the frame, the fonts, the icons and the settings screen
# (#318). Lives in its own repository (sapphire-turtle/corundum-framework). `serde` for its
# store: the look in effect, kept on the device for the next start (#347).
corundum-framework-gui = { workspace = true, features = ["serde", "keys"] }
# The bridge's directory, for its log files (the bridge's window).
corundum-framework-platform.workspace = true
# The program the bridge's service starts, beside which Sapphire Bridge's window is.
corundum-framework-service.workspace = true
# The package's updater and the binary's release, for the bridge window's About (`package`).
corundum-framework-package = { version = "0.11.0", features = ["service"], optional = true }
corundum-framework-update = { version = "0.11.0", default-features = false, optional = true }
# The organization's update key, `package::UPDATE_PUBKEY`.
sapphire-framework-update = { version = "0.28.0", path = "../sapphire-framework-update", default-features = false, optional = true }
# The served workspace's API keys: where they are (Settings › API keys).
sapphire-framework-keys = { version = "0.28.0", path = "../sapphire-framework-keys" }
egui = "0.37"
eframe = { version = "0.37", optional = true }
# The app's directories: where its default workspace goes (the workspace screen), and the
# window's own (`eframe`). Already in the graph through sapphire-backend.
sapphire-workspace = { package = "sapphire-framework-workspace", version = "0.28.0", path = "../sapphire-framework-workspace", default-features = false }
sapphire-framework-server = { version = "0.28.0", path = "../sapphire-framework-server", default-features = false, features = ["redb-store"], optional = true }
sapphire-framework-bridge = { version = "0.28.0", path = "../sapphire-framework-bridge", optional = true }
grain-id.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time", "macros", "process"] }
tracing.workspace = true

[dev-dependencies]
corundum-framework-package = { version = "0.11.0", features = ["service", "test-support"] }
sapphire-framework-bridge = { path = "../sapphire-framework-bridge", features = ["test-util"] }
sapphire-framework-server = { path = "../sapphire-framework-server", features = ["test-util"] }
sapphire-workspace = { package = "sapphire-framework-workspace", path = "../sapphire-framework-workspace", default-features = false }
tempfile = "3"
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
