[package]
name = "sapphire-bridge-desktop"
# Released with the framework, under its `v{version}` tags; its binary goes onto that
# release (release-bridge.yml), not to crates.io.
version.workspace = true
edition.workspace = true
description = "Sapphire Bridge's desktop app: its window, and the same commands as sapphire-bridge"
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "sapphire-bridge-desktop"
path = "src/main.rs"

# The Windows console shim the package puts on `PATH` as `sapphire-bridge.exe`
# (src/bin/console.rs).
[[bin]]
name = "sapphire-bridge-console"
path = "src/bin/console.rs"
required-features = ["velopack"]

[features]
# The release workflow's build: the Velopack package's start, its updater, its first run
# and its service (src/package.rs). `cargo build` makes the plain binary.
velopack = [
    "dep:corundum-framework-package",
    "dep:corundum-framework-platform",
    "dep:corundum-framework-update",
    "dep:tracing",
    "sapphire-framework-gui/package",
]

[dependencies]
sapphire-bridge = { package = "sapphire-framework-bridge", version = "0.23.0", path = "../../crates/sapphire-framework-bridge", features = ["node"] }
sapphire-framework-bridge-embed = { version = "0.23.0", path = "../../crates/sapphire-framework-bridge-embed", features = ["factory"] }
sapphire-framework-gui = { version = "0.23.0", path = "../../crates/sapphire-framework-gui", features = ["eframe"] }
corundum-framework-package = { version = "0.7.0", features = ["service"], optional = true }
corundum-framework-platform = { workspace = true, optional = true }
corundum-framework-update = { version = "0.7.0", default-features = false, optional = true }
tracing = { workspace = true, optional = true }
clap.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

[dev-dependencies]
# examples/icons.rs renders the package's icons.
corundum-framework-platform.workspace = true
corundum-framework-package = { version = "0.7.0", features = ["service", "test-support"] }
tempfile = "3"
