name: Release sapphire-bridge binaries

# Builds the cross-platform sapphire-bridge binaries, signs them with minisign
# and uploads both onto an existing GitHub release. `sapphire-bridge update`
# installs only a binary whose `.minisig` verifies against the public key built
# into it (BRIDGE_RELEASE_KEY) and whose trusted comment is "<asset> <version>".
#
# The build jobs have no write access and never see the key: they hand their
# binaries to the sign job as workflow artifacts, so nothing in the release is
# signed that this run did not build.
#
# Called from release-plz.yml right after the `v{version}` tag and release
# are created, plus workflow_dispatch for retroactive uploads and manual
# recovery.
on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
        description: 'Existing release tag to attach binaries to (e.g. v0.16.0).'
    secrets:
      MINISIGN_SECRET_KEY:
        required: true
  workflow_dispatch:
    inputs:
      tag:
        required: true
        type: string
        description: 'Existing release tag to attach binaries to (e.g. v0.16.0).'

jobs:
  build:
    # macOS and Windows are not built by CI on every pull request, so a
    # failure there must not keep the Linux binaries from being uploaded.
    continue-on-error: ${{ matrix.continue-on-error }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            binary: sapphire-bridge
            asset_name: sapphire-bridge-linux-x86_64
            continue-on-error: false
          - os: ubuntu-24.04-arm
            binary: sapphire-bridge
            asset_name: sapphire-bridge-linux-aarch64
            continue-on-error: false
          - os: macos-latest
            binary: sapphire-bridge
            asset_name: sapphire-bridge-macos-aarch64
            continue-on-error: true
          - os: windows-latest
            binary: sapphire-bridge.exe
            asset_name: sapphire-bridge-windows-x86_64.exe
            continue-on-error: true
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      # Toolchain comes from rust-toolchain.toml; rustup installs it on first use.
      - name: Install the pinned toolchain
        run: cargo --version

      - uses: Swatinem/rust-cache@v2

      # grain-id needs protoc (prost-build); native-tls needs OpenSSL on Linux only.
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libssl-dev pkg-config
      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install protobuf
      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: choco install protoc

      - run: cargo build --release --locked --package sapphire-bridge

      - name: Rename binary
        shell: bash
        run: cp target/release/${{ matrix.binary }} ${{ matrix.asset_name }}

      - name: Hand the binary to the sign job
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}
          if-no-files-found: error
          retention-days: 1

  sign:
    # Whatever built: a macOS or Windows failure must not hold back the Linux binaries.
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Install minisign
        run: sudo apt-get update && sudo apt-get install -y minisign

      # The trusted comment is signed with the file: "<asset> <version>" ties each
      # signature to exactly this binary of exactly this release.
      - name: Sign
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          TAG: ${{ inputs.tag }}
        run: |
          umask 077
          key="$RUNNER_TEMP/minisign.key"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$MINISIGN_SECRET_KEY" > "$key"
          version="${TAG#v}"
          for f in dist/*; do
            name="$(basename "$f")"
            minisign -S -s "$key" -m "$f" -t "$name $version" < /dev/null
          done
          ls -l dist

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
