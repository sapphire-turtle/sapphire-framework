[package]
name = "sapphire-sync-ui"
# The app's screens, shared by the desktop window and the phone app; versioned with them.
version = "0.1.0"
edition.workspace = true
description = "sapphire-sync's screens, shared by its desktop and mobile apps"
license-file = "LICENSE"
repository.workspace = true
publish = false

[dependencies]
# `eframe`: the screens are an `eframe::App`, and `gui::{eframe, egui}` are the versions
# the framework's views render with.
sapphire-framework = { version = "0.21.0", default-features = false, features = ["eframe"] }
