name: Release sapphire-bridge binaries

# Builds the sapphire-bridge binaries and attaches them to an existing release.
# release-plz.yml calls it after a release; run it by hand to (re)upload them
# for an existing tag.
on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        required: true
        type: string
        description: 'Existing release tag to attach binaries to (e.g. v0.19.0).'

jobs:
  build:
    permissions:
      contents: write
    uses: ./.github/workflows/shared-release-binary.yml
    with:
      tag: ${{ inputs.tag }}
      package: sapphire-bridge
      binary: sapphire-bridge
      linux-packages: libssl-dev pkg-config
