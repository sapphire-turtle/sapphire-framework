name: CI

on:
  pull_request:

jobs:
  ci:
    uses: sapphire-turtle/.github/.github/workflows/rust-ci.yml@v1
    with:
      # cmake for aws-lc-sys; Wayland and xkbcommon for the gui crate.
      linux-packages: cmake libwayland-dev libxkbcommon-dev
      # A facade feature can name a dependency that only compiles with its
      # neighbours enabled: a manifest test sees the text, a compile proves the
      # promise each feature makes on its own.
      post-test: |
        for f in workspace retrieve track sync session ipc server http mcp frontmatter bridge keys service registry backend eframe; do
          cargo check -p sapphire-framework --no-default-features --features "$f" --locked || exit 1
        done
